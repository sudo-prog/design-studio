<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="btn" cx="40%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#f8f8f8"/>
      <stop offset="100%" style="stop-color:#d8d8d8"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="3" dy="5" stdDeviation="8" flood-opacity="0.22"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Button face -->
    <circle cx="200" cy="200" r="155" fill="url(#btn)" stroke="#cccccc" stroke-width="2"/>
    <!-- Metal rim -->
    <circle cx="200" cy="200" r="155" fill="none" stroke="#b8b8b8" stroke-width="6"/>
    <!-- Inner print area guide -->
    <circle cx="200" cy="200" r="140" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="6 4"/>
    <!-- Pin back hint (small) -->
    <circle cx="200" cy="200" r="8" fill="#c0c0c0" stroke="#b0b0b0" stroke-width="1.5"/>
  </g>
  <!-- Print area overlay -->
  <circle cx="200" cy="200" r="138" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="200" y="206" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#aaa">Print area</text>
  <text x="200" y="222" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#bbb">58mm button</text>
</svg>
