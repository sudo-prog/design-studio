<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ede8"/>
      <stop offset="100%" style="stop-color:#d8d4cc"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="3" dy="5" stdDeviation="6" flood-opacity="0.2"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Spine -->
    <rect x="55" y="20" width="28" height="480" rx="4" fill="#c8c4bc" stroke="#bbb" stroke-width="1.5"/>
    <!-- Spine lines -->
    <line x1="62" y1="30" x2="62" y2="490" stroke="#b8b4ac" stroke-width="1"/>
    <line x1="74" y1="30" x2="74" y2="490" stroke="#b8b4ac" stroke-width="1"/>
    <!-- Cover -->
    <rect x="83" y="20" width="272" height="480" rx="4" fill="url(#cover)" stroke="#bbb" stroke-width="1.5"/>
    <!-- Elastic band -->
    <line x1="83" y1="280" x2="355" y2="280" stroke="#b0a898" stroke-width="3"/>
    <!-- Ribbon bookmark -->
    <rect x="340" y="18" width="6" height="60" rx="2" fill="#c8b4a8"/>
    <path d="M 340 78 L 343 90 L 346 78 Z" fill="#c8b4a8"/>
  </g>
  <rect x="105" y="50" width="228" height="380" rx="4" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="219" y="248" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#aaa">Cover print area</text>
</svg>
