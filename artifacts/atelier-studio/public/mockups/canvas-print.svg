<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <defs>
    <filter id="shadow"><feDropShadow dx="3" dy="5" stdDeviation="6" flood-opacity="0.2"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Canvas wrap depth (sides) -->
    <rect x="26" y="30" width="348" height="300" rx="2" fill="#d0cdc8" stroke="#bbb" stroke-width="1"/>
    <!-- Top depth -->
    <rect x="30" y="22" width="340" height="14" rx="2" fill="#c8c4be" stroke="#bbb" stroke-width="1"/>
    <!-- Left depth -->
    <rect x="20" y="26" width="14" height="308" rx="2" fill="#c0bdb8" stroke="#bbb" stroke-width="1"/>
    <!-- Canvas face -->
    <rect x="34" y="36" width="332" height="286" rx="1" fill="#f8f8f6" stroke="#ddd" stroke-width="1"/>
    <!-- Stretcher bar cross -->
    <line x1="34" y1="179" x2="366" y2="179" stroke="#e0ddd8" stroke-width="2"/>
    <line x1="200" y1="36" x2="200" y2="322" stroke="#e0ddd8" stroke-width="2"/>
  </g>
  <rect x="50" y="50" width="300" height="260" rx="2" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="200" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#bbb">Canvas Print</text>
  <text x="200" y="202" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ccc">Gallery wrap · 300 DPI</text>
</svg>
