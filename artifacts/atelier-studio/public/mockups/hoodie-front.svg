<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#c8c8c8"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Sleeves -->
    <path d="M 55 80 L 5 200 L 65 220 L 100 110" fill="url(#fabric)" stroke="#bbb" stroke-width="1.5"/>
    <path d="M 345 80 L 395 200 L 335 220 L 300 110" fill="url(#fabric)" stroke="#bbb" stroke-width="1.5"/>
    <!-- Body -->
    <path d="M 100 60 Q 145 20 175 25 L 185 75 Q 195 80 200 80 Q 205 80 215 75 L 225 25 Q 255 20 300 60 L 300 110 L 335 220 L 335 430 L 65 430 L 65 220 L 100 110 Z" fill="url(#fabric)" stroke="#bbb" stroke-width="1.5"/>
    <!-- Hood -->
    <path d="M 175 25 Q 160 5 155 0 Q 175 8 200 8 Q 225 8 245 0 Q 240 5 225 25" fill="url(#fabric)" stroke="#bbb" stroke-width="1.5"/>
    <!-- Kangaroo pocket -->
    <path d="M 145 290 Q 145 310 200 312 Q 255 310 255 290 L 255 330 Q 200 335 145 330 Z" fill="#d0d0d0" stroke="#bbb" stroke-width="1"/>
    <!-- Zipper -->
    <line x1="200" y1="80" x2="200" y2="300" stroke="#bbb" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <rect x="120" y="120" width="160" height="150" rx="4" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="200" y="202" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#aaa">Print area</text>
</svg>
