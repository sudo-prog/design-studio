<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <defs>
    <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ede8"/>
      <stop offset="100%" style="stop-color:#d8d4cc"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Handles -->
    <path d="M 145 95 Q 140 40 160 35 Q 175 30 180 60 L 178 95" fill="none" stroke="#bbb" stroke-width="10" stroke-linecap="round"/>
    <path d="M 255 95 Q 260 40 240 35 Q 225 30 220 60 L 222 95" fill="none" stroke="#bbb" stroke-width="10" stroke-linecap="round"/>
    <!-- Bag body -->
    <rect x="70" y="90" width="260" height="340" rx="8" fill="url(#fabric)" stroke="#bbb" stroke-width="1.5"/>
    <!-- Side gusset hint -->
    <line x1="90" y1="90" x2="90" y2="430" stroke="#ccc" stroke-width="1"/>
    <line x1="310" y1="90" x2="310" y2="430" stroke="#ccc" stroke-width="1"/>
    <!-- Top hem -->
    <rect x="70" y="90" width="260" height="16" rx="4" fill="#d8d4cc" stroke="#bbb" stroke-width="1"/>
  </g>
  <rect x="100" y="140" width="200" height="230" rx="4" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="200" y="262" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#aaa">Print area</text>
</svg>
