<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-opacity="0.15"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Sheet body -->
    <rect x="40" y="30" width="320" height="440" rx="6" fill="#fefefe" stroke="#ddd" stroke-width="1.5"/>
    <!-- Die-cut guides (individual sticker outlines) -->
    <!-- Row 1 -->
    <rect x="65" y="55" width="120" height="120" rx="60" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="215" y="55" width="120" height="120" rx="12" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- Row 2 -->
    <ellipse cx="125" cy="255" rx="75" ry="55" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="215" y="200" width="120" height="110" rx="55" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- Row 3 -->
    <rect x="65" y="340" width="120" height="100" rx="8" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="215" y="340" width="120" height="100" rx="50" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- Bleed marks corners -->
    <line x1="40" y1="50" x2="55" y2="50" stroke="#ccc" stroke-width="1"/>
    <line x1="50" y1="30" x2="50" y2="45" stroke="#ccc" stroke-width="1"/>
    <line x1="345" y1="50" x2="360" y2="50" stroke="#ccc" stroke-width="1"/>
    <line x1="350" y1="30" x2="350" y2="45" stroke="#ccc" stroke-width="1"/>
    <line x1="40" y1="450" x2="55" y2="450" stroke="#ccc" stroke-width="1"/>
    <line x1="50" y1="455" x2="50" y2="470" stroke="#ccc" stroke-width="1"/>
    <line x1="345" y1="450" x2="360" y2="450" stroke="#ccc" stroke-width="1"/>
    <line x1="350" y1="455" x2="350" y2="470" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="200" y="495" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#bbb">Kiss-cut sticker sheet · 300 DPI</text>
</svg>
