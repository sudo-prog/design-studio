<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#d0d0d0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.2"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Case body -->
    <rect x="105" y="30" width="190" height="440" rx="28" fill="url(#case)" stroke="#bbb" stroke-width="2"/>
    <!-- Camera cutout -->
    <rect x="225" y="50" width="55" height="55" rx="14" fill="#c8c8c8" stroke="#bbb" stroke-width="1.5"/>
    <circle cx="252" cy="77" r="16" fill="#b8b8b8" stroke="#bbb" stroke-width="1"/>
    <circle cx="252" cy="77" r="8" fill="#a0a0a0"/>
    <!-- Screen area -->
    <rect x="118" y="118" width="164" height="298" rx="12" fill="#d8d8d8" stroke="#ccc" stroke-width="1"/>
    <!-- Side buttons -->
    <rect x="100" y="180" width="6" height="40" rx="3" fill="#cccccc" stroke="#bbb" stroke-width="1"/>
    <rect x="294" y="160" width="6" height="30" rx="3" fill="#cccccc" stroke="#bbb" stroke-width="1"/>
    <rect x="294" y="200" width="6" height="50" rx="3" fill="#cccccc" stroke="#bbb" stroke-width="1"/>
  </g>
  <rect x="118" y="118" width="164" height="298" rx="12" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="200" y="272" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#aaa">Print area</text>
</svg>
